<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img">
<defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;SF Pro Text&quot;, &quot;Helvetica Neue&quot;, Helvetica, Inter, &quot;Segoe UI&quot;, Arial, sans-serif;}
.up{animation:up 1s cubic-bezier(.25,.1,.25,1) both;}
.d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.19s}
.d4{animation-delay:.26s}.d5{animation-delay:.33s}.d6{animation-delay:.4s}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.bar{animation:wave 1.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center;}
@keyframes wave{0%{transform:scaleY(.3)}100%{transform:scaleY(1)}}
.greet{opacity:0;animation:greet 9s ease-in-out infinite;}
@keyframes greet{0%,100%{opacity:0}12%,40%{opacity:1}55%{opacity:0}}
</style></defs>
<rect width="1000" height="300" rx="22" fill="#000000"/>

<circle cx="770" cy="150" r="70" fill="none" stroke="#fff" stroke-opacity="0.14"/><circle cx="770" cy="150" r="104" fill="none" stroke="#fff" stroke-opacity="0.08"/><circle cx="770" cy="150" r="138" fill="none" stroke="#fff" stroke-opacity="0.045"/><line class="bar" style="animation-delay:-0.99s" x1="693" y1="146.0" x2="693" y2="154.0" stroke="#f5f5f7" stroke-width="3" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.90s" x1="700" y1="143.5" x2="700" y2="156.5" stroke="#f5f5f7" stroke-width="3" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.81s" x1="707" y1="139.5" x2="707" y2="160.5" stroke="#f5f5f7" stroke-width="3" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.72s" x1="714" y1="135.0" x2="714" y2="165.0" stroke="#f5f5f7" stroke-width="3" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.63s" x1="721" y1="138.0" x2="721" y2="162.0" stroke="#f5f5f7" stroke-width="3" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.54s" x1="728" y1="130.0" x2="728" y2="170.0" stroke="#f5f5f7" stroke-width="3" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.45s" x1="735" y1="124.5" x2="735" y2="175.5" stroke="#f5f5f7" stroke-width="3" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.36s" x1="742" y1="133.0" x2="742" y2="167.0" stroke="#f5f5f7" stroke-width="3" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.27s" x1="749" y1="121.0" x2="749" y2="179.0" stroke="#f5f5f7" stroke-width="3" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.18s" x1="756" y1="128.0" x2="756" y2="172.0" stroke="#f5f5f7" stroke-width="3" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.09s" x1="763" y1="117.0" x2="763" y2="183.0" stroke="#f5f5f7" stroke-width="3" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.00s" x1="770" y1="122.5" x2="770" y2="177.5" stroke="#f5f5f7" stroke-width="3" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.09s" x1="777" y1="117.0" x2="777" y2="183.0" stroke="#f5f5f7" stroke-width="3" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.18s" x1="784" y1="128.0" x2="784" y2="172.0" stroke="#f5f5f7" stroke-width="3" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.27s" x1="791" y1="121.0" x2="791" y2="179.0" stroke="#f5f5f7" stroke-width="3" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.36s" x1="798" y1="133.0" x2="798" y2="167.0" stroke="#f5f5f7" stroke-width="3" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.45s" x1="805" y1="124.5" x2="805" y2="175.5" stroke="#f5f5f7" stroke-width="3" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.54s" x1="812" y1="130.0" x2="812" y2="170.0" stroke="#f5f5f7" stroke-width="3" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.63s" x1="819" y1="138.0" x2="819" y2="162.0" stroke="#f5f5f7" stroke-width="3" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.72s" x1="826" y1="135.0" x2="826" y2="165.0" stroke="#f5f5f7" stroke-width="3" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.81s" x1="833" y1="139.5" x2="833" y2="160.5" stroke="#f5f5f7" stroke-width="3" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.90s" x1="840" y1="143.5" x2="840" y2="156.5" stroke="#f5f5f7" stroke-width="3" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.99s" x1="847" y1="146.0" x2="847" y2="154.0" stroke="#f5f5f7" stroke-width="3" stroke-linecap="round"/><text class="greet" style="animation-delay:0s" x="678" y="68" font-size="12" fill="#86868b" text-anchor="middle">नमस्ते</text><text class="greet" style="animation-delay:1.5s" x="848" y="78" font-size="12" fill="#86868b" text-anchor="middle">ਸਤ ਸ੍ਰੀ ਅਕਾਲ</text><text class="greet" style="animation-delay:3s" x="674" y="248" font-size="12" fill="#86868b" text-anchor="middle">வணக்கம்</text><text class="greet" style="animation-delay:4.5s" x="852" y="242" font-size="12" fill="#86868b" text-anchor="middle">నమస్కారం</text><text class="greet" style="animation-delay:6s" x="874" y="155" font-size="12" fill="#86868b" text-anchor="middle">নমস্কার</text><text class="greet" style="animation-delay:7.5s" x="652" y="155" font-size="12" fill="#86868b" text-anchor="middle">Hello</text>
<text x="44.0" y="62.0" font-size="12" font-weight="600" fill="#86868b" text-anchor="start" class="up d1">Featured project</text>
<text x="42.0" y="114.0" font-size="50" font-weight="600" fill="#f5f5f7" text-anchor="start" letter-spacing="-1.4" class="up d2">Hardini</text>
<text x="44.0" y="146.0" font-size="19" font-weight="400" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.3" class="up d3">Ask anything. In your own language.</text>
<text x="44.0" y="176.0" font-size="13" font-weight="400" fill="#86868b" text-anchor="start" class="up d4">A voice AI platform for India’s farmers. Crop diseases, mandi</text>
<text x="44.0" y="195.0" font-size="13" font-weight="400" fill="#86868b" text-anchor="start" class="up d4">prices, weather and government schemes, in their native tongue.</text>
<g class="up d5">
<line x1="44.0" y1="218.0" x2="444.0" y2="218.0" stroke="#424245" stroke-width="1"/>
<text x="44.0" y="242.0" font-size="12" font-weight="400" fill="#86868b" text-anchor="start">Built in 24 hours at AI HackMatrix, Chandigarh University.</text>
<text x="44.0" y="260.0" font-size="12" font-weight="400" fill="#86868b" text-anchor="start">1st Runner-Up at Spark Tank, IIFM Bhopal. 250+ teams.</text>
</g>

</svg>