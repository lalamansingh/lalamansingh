<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img">
<defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;SF Pro Text&quot;, &quot;Helvetica Neue&quot;, Helvetica, Inter, &quot;Segoe UI&quot;, Arial, sans-serif;}
.up{animation:up 1.2s cubic-bezier(.25,.1,.25,1) both;}
.d1{animation-delay:.05s}.d2{animation-delay:.15s}.d3{animation-delay:.25s}
.d4{animation-delay:.35s}.d5{animation-delay:.45s}.d6{animation-delay:.55s}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.bar{animation:wave 1.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center;}
@keyframes wave{0%{transform:scaleY(.3)}100%{transform:scaleY(1)}}
.greet{opacity:0;animation:greet 9s ease-in-out infinite;}
@keyframes greet{0%,100%{opacity:0}12%,40%{opacity:1}55%{opacity:0}}
</style></defs>
<rect width="1000" height="560" rx="28" fill="#000000"/>

<circle cx="760" cy="280" r="116" fill="none" stroke="#fff" stroke-opacity="0.14"/><circle cx="760" cy="280" r="176" fill="none" stroke="#fff" stroke-opacity="0.08"/><circle cx="760" cy="280" r="236" fill="none" stroke="#fff" stroke-opacity="0.045"/>
<line class="bar" style="animation-delay:-0.99s" x1="639" y1="273.0" x2="639" y2="287.0" stroke="#f5f5f7" stroke-width="4.5" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.90s" x1="650" y1="268.0" x2="650" y2="292.0" stroke="#f5f5f7" stroke-width="4.5" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.81s" x1="661" y1="261.0" x2="661" y2="299.0" stroke="#f5f5f7" stroke-width="4.5" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.72s" x1="672" y1="253.0" x2="672" y2="307.0" stroke="#f5f5f7" stroke-width="4.5" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.63s" x1="683" y1="258.0" x2="683" y2="302.0" stroke="#f5f5f7" stroke-width="4.5" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.54s" x1="694" y1="244.0" x2="694" y2="316.0" stroke="#f5f5f7" stroke-width="4.5" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.45s" x1="705" y1="234.0" x2="705" y2="326.0" stroke="#f5f5f7" stroke-width="4.5" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.36s" x1="716" y1="249.0" x2="716" y2="311.0" stroke="#f5f5f7" stroke-width="4.5" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.27s" x1="727" y1="227.0" x2="727" y2="333.0" stroke="#f5f5f7" stroke-width="4.5" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.18s" x1="738" y1="240.0" x2="738" y2="320.0" stroke="#f5f5f7" stroke-width="4.5" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.09s" x1="749" y1="220.0" x2="749" y2="340.0" stroke="#f5f5f7" stroke-width="4.5" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.00s" x1="760" y1="230.0" x2="760" y2="330.0" stroke="#f5f5f7" stroke-width="4.5" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.09s" x1="771" y1="220.0" x2="771" y2="340.0" stroke="#f5f5f7" stroke-width="4.5" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.18s" x1="782" y1="240.0" x2="782" y2="320.0" stroke="#f5f5f7" stroke-width="4.5" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.27s" x1="793" y1="227.0" x2="793" y2="333.0" stroke="#f5f5f7" stroke-width="4.5" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.36s" x1="804" y1="249.0" x2="804" y2="311.0" stroke="#f5f5f7" stroke-width="4.5" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.45s" x1="815" y1="234.0" x2="815" y2="326.0" stroke="#f5f5f7" stroke-width="4.5" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.54s" x1="826" y1="244.0" x2="826" y2="316.0" stroke="#f5f5f7" stroke-width="4.5" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.63s" x1="837" y1="258.0" x2="837" y2="302.0" stroke="#f5f5f7" stroke-width="4.5" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.72s" x1="848" y1="253.0" x2="848" y2="307.0" stroke="#f5f5f7" stroke-width="4.5" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.81s" x1="859" y1="261.0" x2="859" y2="299.0" stroke="#f5f5f7" stroke-width="4.5" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.90s" x1="870" y1="268.0" x2="870" y2="292.0" stroke="#f5f5f7" stroke-width="4.5" stroke-linecap="round"/><line class="bar" style="animation-delay:-0.99s" x1="881" y1="273.0" x2="881" y2="287.0" stroke="#f5f5f7" stroke-width="4.5" stroke-linecap="round"/>
<text class="greet" style="animation-delay:0s" x="610" y="142" font-size="16" font-weight="400" fill="#86868b" text-anchor="middle">नमस्ते</text><text class="greet" style="animation-delay:1.5s" x="880" y="164" font-size="16" font-weight="400" fill="#86868b" text-anchor="middle">ਸਤ ਸ੍ਰੀ ਅਕਾਲ</text><text class="greet" style="animation-delay:3s" x="602" y="438" font-size="16" font-weight="400" fill="#86868b" text-anchor="middle">வணக்கம்</text><text class="greet" style="animation-delay:4.5s" x="888" y="428" font-size="16" font-weight="400" fill="#86868b" text-anchor="middle">నమస్కారం</text><text class="greet" style="animation-delay:6s" x="926" y="292" font-size="16" font-weight="400" fill="#86868b" text-anchor="middle">নমস্কার</text><text class="greet" style="animation-delay:7.5s" x="564" y="290" font-size="16" font-weight="400" fill="#86868b" text-anchor="middle">Hello</text>
<text x="64" y="124" font-size="14" font-weight="600" fill="#86868b" text-anchor="start" class="up d1">Featured project</text>
<text x="61" y="200" font-size="80" font-weight="600" fill="#f5f5f7" text-anchor="start" letter-spacing="-2.4" class="up d2">Hardini</text>
<text x="64" y="250" font-size="26" font-weight="400" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.5" class="up d3">Ask anything. In your own language.</text>
<text x="64" y="298" font-size="17" font-weight="400" fill="#86868b" text-anchor="start" class="up d4">A voice AI platform for India’s farmers. Crop</text>
<text x="64" y="322" font-size="17" font-weight="400" fill="#86868b" text-anchor="start" class="up d4">diseases, mandi prices, weather and government</text>
<text x="64" y="346" font-size="17" font-weight="400" fill="#86868b" text-anchor="start" class="up d4">schemes. Answered instantly, in their native tongue.</text>
<g class="up d5">
<line x1="64" y1="400" x2="464" y2="400" stroke="#424245" stroke-width="1"/>
<text x="64" y="436" font-size="14" font-weight="400" fill="#86868b" text-anchor="start">Built in 24 hours at AI HackMatrix, Chandigarh University.</text>
<text x="64" y="460" font-size="14" font-weight="400" fill="#86868b" text-anchor="start">1st Runner-Up at Spark Tank, IIFM Bhopal. 250+ teams.</text>
</g>

</svg>