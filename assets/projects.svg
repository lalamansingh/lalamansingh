<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="528" viewBox="0 0 1000 528" role="img">
<defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;SF Pro Text&quot;, &quot;Helvetica Neue&quot;, Helvetica, Inter, &quot;Segoe UI&quot;, Arial, sans-serif;}
.up{animation:up 1s cubic-bezier(.25,.1,.25,1) both;}
.d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.19s}
.d4{animation-delay:.26s}.d5{animation-delay:.33s}.d6{animation-delay:.4s}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style></defs>
<rect width="1000" height="528" rx="22" fill="#f5f5f7"/>
<text x="40.0" y="62.0" font-size="30" font-weight="600" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.7" class="up d1">Projects.</text><text x="40.0" y="88.0" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start" class="up d2">Eight ideas, taken all the way to working code.</text>
<g class="up d3"><rect x="40.0" y="110.0" width="219.5" height="172.0" rx="14" fill="#ffffff"/>
<text x="60.0" y="140.0" font-size="11" font-weight="600" fill="#6e6e73" text-anchor="start">TypeScript</text>
<text x="239.5" y="140.0" font-size="11" font-weight="600" fill="#b64400" text-anchor="end">Live</text>
<text x="60.0" y="170.0" font-size="17" font-weight="600" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.3">FirstRecord</text>
<text x="60.0" y="190.0" font-size="13" font-weight="400" fill="#1d1d1f" text-anchor="start">Policing, in every language.</text>
<line x1="60.0" y1="204.0" x2="239.5" y2="204.0" stroke="#d2d2d7" stroke-width="1"/>
<text x="60.0" y="226.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">Police case and statement</text>
<text x="60.0" y="243.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">records, driven by a Hindi and</text>
<text x="60.0" y="260.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">English voice assistant.</text>
</g>
<g class="up d4"><rect x="273.5" y="110.0" width="219.5" height="172.0" rx="14" fill="#ffffff"/>
<text x="293.5" y="140.0" font-size="11" font-weight="600" fill="#6e6e73" text-anchor="start">TypeScript</text>
<text x="473.0" y="140.0" font-size="11" font-weight="600" fill="#b64400" text-anchor="end">Live</text>
<text x="293.5" y="170.0" font-size="17" font-weight="600" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.3">Aspirofy Roadmaps</text>
<text x="293.5" y="190.0" font-size="13" font-weight="400" fill="#1d1d1f" text-anchor="start">Learning, mapped.</text>
<line x1="293.5" y1="204.0" x2="473.0" y2="204.0" stroke="#d2d2d7" stroke-width="1"/>
<text x="293.5" y="226.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">Interactive learning roadmaps</text>
<text x="293.5" y="243.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">with built-in progress tracking</text>
<text x="293.5" y="260.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">and analytics.</text>
</g>
<g class="up d5"><rect x="507.0" y="110.0" width="219.5" height="172.0" rx="14" fill="#ffffff"/>
<text x="527.0" y="140.0" font-size="11" font-weight="600" fill="#6e6e73" text-anchor="start">Python</text>
<text x="527.0" y="170.0" font-size="17" font-weight="600" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.3">PhishGuard</text>
<text x="527.0" y="190.0" font-size="13" font-weight="400" fill="#1d1d1f" text-anchor="start">Know before you click.</text>
<line x1="527.0" y1="204.0" x2="706.5" y2="204.0" stroke="#d2d2d7" stroke-width="1"/>
<text x="527.0" y="226.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">Machine learning that detects</text>
<text x="527.0" y="243.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">phishing websites and scores</text>
<text x="527.0" y="260.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">their risk.</text>
</g>
<g class="up d6"><rect x="740.5" y="110.0" width="219.5" height="172.0" rx="14" fill="#ffffff"/>
<text x="760.5" y="140.0" font-size="11" font-weight="600" fill="#6e6e73" text-anchor="start">Python</text>
<text x="760.5" y="170.0" font-size="17" font-weight="600" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.3">TruthLens</text>
<text x="760.5" y="190.0" font-size="13" font-weight="400" fill="#1d1d1f" text-anchor="start">See what’s real.</text>
<line x1="760.5" y1="204.0" x2="940.0" y2="204.0" stroke="#d2d2d7" stroke-width="1"/>
<text x="760.5" y="226.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">Image and video authenticity</text>
<text x="760.5" y="243.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">checks, deepfake detection and</text>
<text x="760.5" y="260.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">content restoration.</text>
</g>
<g class="up d3"><rect x="40.0" y="296.0" width="219.5" height="172.0" rx="14" fill="#ffffff"/>
<text x="60.0" y="326.0" font-size="11" font-weight="600" fill="#6e6e73" text-anchor="start">TypeScript</text>
<text x="239.5" y="326.0" font-size="11" font-weight="600" fill="#b64400" text-anchor="end">Live</text>
<text x="60.0" y="356.0" font-size="17" font-weight="600" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.3">Real or Rendered?</text>
<text x="60.0" y="376.0" font-size="13" font-weight="400" fill="#1d1d1f" text-anchor="start">Train your eyes.</text>
<line x1="60.0" y1="390.0" x2="239.5" y2="390.0" stroke="#d2d2d7" stroke-width="1"/>
<text x="60.0" y="412.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">A five-minute daily game. Spot</text>
<text x="60.0" y="429.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">AI-made images, voices and</text>
<text x="60.0" y="446.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">videos, then learn the clues.</text>
</g>
<g class="up d4"><rect x="273.5" y="296.0" width="219.5" height="172.0" rx="14" fill="#ffffff"/>
<text x="293.5" y="326.0" font-size="11" font-weight="600" fill="#6e6e73" text-anchor="start">TypeScript</text>
<text x="473.0" y="326.0" font-size="11" font-weight="600" fill="#b64400" text-anchor="end">Live</text>
<text x="293.5" y="356.0" font-size="17" font-weight="600" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.3">ORCA</text>
<text x="293.5" y="376.0" font-size="13" font-weight="400" fill="#1d1d1f" text-anchor="start">Oceans, reasoned.</text>
<line x1="293.5" y1="390.0" x2="473.0" y2="390.0" stroke="#d2d2d7" stroke-width="1"/>
<text x="293.5" y="412.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">Marine ecosystem reasoning</text>
<text x="293.5" y="429.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">powered by collaborative AI</text>
<text x="293.5" y="446.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">agents.</text>
</g>
<g class="up d5"><rect x="507.0" y="296.0" width="219.5" height="172.0" rx="14" fill="#ffffff"/>
<text x="527.0" y="326.0" font-size="11" font-weight="600" fill="#6e6e73" text-anchor="start">Python</text>
<text x="706.5" y="326.0" font-size="11" font-weight="600" fill="#b64400" text-anchor="end">Live</text>
<text x="527.0" y="356.0" font-size="17" font-weight="600" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.3">ATS Resume Scorer</text>
<text x="527.0" y="376.0" font-size="13" font-weight="400" fill="#1d1d1f" text-anchor="start">Get past the filter.</text>
<line x1="527.0" y1="390.0" x2="706.5" y2="390.0" stroke="#d2d2d7" stroke-width="1"/>
<text x="527.0" y="412.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">Scores resumes against a job</text>
<text x="527.0" y="429.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">description, flags mistakes and</text>
<text x="527.0" y="446.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">catches prompt injection.</text>
</g>
<g class="up d6"><rect x="740.5" y="296.0" width="219.5" height="172.0" rx="14" fill="#ffffff"/>
<text x="760.5" y="326.0" font-size="11" font-weight="600" fill="#6e6e73" text-anchor="start">TypeScript</text>
<text x="760.5" y="356.0" font-size="17" font-weight="600" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.3">X-Green Tracker</text>
<text x="760.5" y="376.0" font-size="13" font-weight="400" fill="#1d1d1f" text-anchor="start">Bugs, simplified.</text>
<line x1="760.5" y1="390.0" x2="940.0" y2="390.0" stroke="#d2d2d7" stroke-width="1"/>
<text x="760.5" y="412.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">A free, self-hosted Jira</text>
<text x="760.5" y="429.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">alternative for small teams.</text>
<text x="760.5" y="446.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start">Built on Next.js and Supabase.</text>
</g>
<text x="500.0" y="504.0" font-size="12" font-weight="400" fill="#86868b" text-anchor="middle" class="up d6">Every project is open source. Explore them in the repositories below.</text>
</svg>