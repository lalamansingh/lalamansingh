<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img">
<defs>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;SF Pro Text&quot;, Inter, &quot;Segoe UI&quot;, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;}
.up{animation:up 1.1s cubic-bezier(.16,1,.3,1) both;}
.d1{animation-delay:.08s}.d2{animation-delay:.18s}.d3{animation-delay:.28s}
.d4{animation-delay:.38s}.d5{animation-delay:.48s}.d6{animation-delay:.58s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.drift1{animation:drift1 14s ease-in-out infinite alternate;}
.drift2{animation:drift2 17s ease-in-out infinite alternate;}
.drift3{animation:drift3 12s ease-in-out infinite alternate;}
@keyframes drift1{to{transform:translate(70px,-18px)}}
@keyframes drift2{to{transform:translate(-80px,10px)}}
@keyframes drift3{to{transform:translate(40px,14px)}}
.pulse{animation:pulse 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center;}
@keyframes pulse{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
</style>
<clipPath id="card"><rect x="0" y="0" width="1000" height="540" rx="30"/></clipPath>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="56"/></filter>
<filter id="blurS" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="34"/></filter>
<linearGradient id="ai" gradientUnits="userSpaceOnUse" x1="180" y1="0" x2="820" y2="0" spreadMethod="reflect"><stop offset="0.00" stop-color="#ff9f0a"/><stop offset="0.25" stop-color="#ff375f"/><stop offset="0.50" stop-color="#bf5af2"/><stop offset="0.75" stop-color="#5e5ce6"/><stop offset="1.00" stop-color="#0a84ff"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;640 0;0 0" dur="14s" repeatCount="indefinite"/></linearGradient>

</defs>
<rect x="0" y="0" width="1000" height="540" rx="30" fill="#000000"/>
<g clip-path="url(#card)">
<text x="56" y="104" font-size="52" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-1.6" class="up d1">Experience.</text><text x="56" y="142" font-size="21" font-weight="400" fill="#86868b" text-anchor="start" class="up d2">Where products meet people.</text>
<g class="up d3">
<rect x="56" y="180" width="436.0" height="304" rx="22" fill="#161617"/><rect x="56.5" y="180.5" width="435.0" height="303" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".06"/>
<circle class="pulse" cx="98" cy="224" r="5" fill="#30d158"/><circle cx="98" cy="224" r="5" fill="#30d158"/>
<text x="112" y="229" font-size="14" font-weight="600" fill="#30d158" text-anchor="start" letter-spacing="0.3">Now</text>
<text x="456.0" y="229" font-size="14" font-weight="500" fill="#86868b" text-anchor="end">Aug 2026 – Present</text>
<text x="92" y="300" font-size="29" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.6">AI Product Intern</text>
<text x="92" y="336" font-size="22" font-weight="600" fill="url(#ai)" text-anchor="start">IndusLabs</text>
<text x="92" y="386" font-size="17" font-weight="400" fill="#a1a1a6" text-anchor="start">Building voice AI agents that speak</text>
<text x="92" y="410" font-size="17" font-weight="400" fill="#a1a1a6" text-anchor="start">India’s languages.</text>
<line x1="92" y1="438" x2="456.0" y2="438" stroke="#fff" stroke-opacity=".07"/>
<text x="92" y="464" font-size="13" font-weight="500" fill="#6e6e73" text-anchor="start" letter-spacing="0.2">On-site  ·  Noida  ·  4 mos</text>
</g>
<g class="up d4">
<rect x="508.0" y="180" width="436.0" height="304" rx="22" fill="#161617"/><rect x="508.5" y="180.5" width="435.0" height="303" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".06"/>
<circle cx="550.0" cy="224" r="5" fill="#6e6e73"/>
<text x="564.0" y="229" font-size="14" font-weight="600" fill="#86868b" text-anchor="start" letter-spacing="0.3">Completed</text>
<text x="908.0" y="229" font-size="14" font-weight="500" fill="#86868b" text-anchor="end">Feb – Jul 2026</text>
<text x="544.0" y="300" font-size="29" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.6">Product Manager Intern</text>
<text x="544.0" y="336" font-size="22" font-weight="600" fill="url(#ai)" text-anchor="start">RYM Grenergy</text>
<text x="544.0" y="386" font-size="17" font-weight="400" fill="#a1a1a6" text-anchor="start">A six-month product management</text>
<text x="544.0" y="410" font-size="17" font-weight="400" fill="#a1a1a6" text-anchor="start">internship.</text>
<line x1="544.0" y1="438" x2="908.0" y2="438" stroke="#fff" stroke-opacity=".07"/>
<text x="544.0" y="464" font-size="13" font-weight="500" fill="#6e6e73" text-anchor="start" letter-spacing="0.2">Internship  ·  6 mos</text>
</g>
</g>
<rect x=".5" y=".5" width="999" height="539" rx="29.5" fill="none" stroke="#fff" stroke-opacity=".09"/>
</svg>