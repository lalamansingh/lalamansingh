<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img">
<defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;SF Pro Text&quot;, &quot;Helvetica Neue&quot;, Helvetica, Inter, &quot;Segoe UI&quot;, Arial, sans-serif;}
.up{animation:up 1.2s cubic-bezier(.25,.1,.25,1) both;}
.d1{animation-delay:.05s}.d2{animation-delay:.15s}.d3{animation-delay:.25s}
.d4{animation-delay:.35s}.d5{animation-delay:.45s}.d6{animation-delay:.55s}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style></defs>
<rect width="1000" height="530" rx="28" fill="#f5f5f7"/>
<text x="56" y="106" font-size="48" font-weight="600" fill="#1d1d1f" text-anchor="start" letter-spacing="-1.2" class="up d1">Experience.</text><text x="56" y="144" font-size="21" font-weight="400" fill="#6e6e73" text-anchor="start" letter-spacing="-0.2" class="up d2">Two internships. One focus: the people who use the product.</text>
<g class="up d3">
<rect x="56.0" y="184" width="434.0" height="290" rx="18" fill="#ffffff"/>
<text x="92.0" y="234" font-size="14" font-weight="600" fill="#b64400" text-anchor="start">Current</text>
<text x="454.0" y="234" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="end">Aug 2026 – Present</text>
<text x="92.0" y="300" font-size="30" font-weight="600" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.7">AI Product Intern</text>
<text x="92.0" y="334" font-size="21" font-weight="400" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.2">IndusLabs</text>
<text x="92.0" y="382" font-size="17" font-weight="400" fill="#6e6e73" text-anchor="start">Shaping voice AI agents that speak</text>
<text x="92.0" y="406" font-size="17" font-weight="400" fill="#6e6e73" text-anchor="start">India’s languages.</text>
<line x1="92.0" y1="430" x2="454.0" y2="430" stroke="#d2d2d7" stroke-width="1"/>
<text x="92.0" y="456" font-size="13" font-weight="400" fill="#86868b" text-anchor="start">On-site, Noida</text>
</g>
<g class="up d4">
<rect x="510.0" y="184" width="434.0" height="290" rx="18" fill="#ffffff"/>
<text x="546.0" y="234" font-size="14" font-weight="600" fill="#6e6e73" text-anchor="start">Feb – Jul 2026</text>
<text x="908.0" y="234" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="end"></text>
<text x="546.0" y="300" font-size="30" font-weight="600" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.7">Product Manager Intern</text>
<text x="546.0" y="334" font-size="21" font-weight="400" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.2">RYM Grenergy</text>
<text x="546.0" y="382" font-size="17" font-weight="400" fill="#6e6e73" text-anchor="start">Six months in product management.</text>
<text x="546.0" y="406" font-size="17" font-weight="400" fill="#6e6e73" text-anchor="start"></text>
<line x1="546.0" y1="430" x2="908.0" y2="430" stroke="#d2d2d7" stroke-width="1"/>
<text x="546.0" y="456" font-size="13" font-weight="400" fill="#86868b" text-anchor="start">Internship</text>
</g>
</svg>