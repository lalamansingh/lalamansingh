<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img">
<defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;SF Pro Text&quot;, &quot;Helvetica Neue&quot;, Helvetica, Inter, &quot;Segoe UI&quot;, Arial, sans-serif;}
.up{animation:up 1.2s cubic-bezier(.25,.1,.25,1) both;}
.d1{animation-delay:.05s}.d2{animation-delay:.15s}.d3{animation-delay:.25s}
.d4{animation-delay:.35s}.d5{animation-delay:.45s}.d6{animation-delay:.55s}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style></defs>
<rect width="1000" height="250" rx="28" fill="#f5f5f7"/>
<text x="125.0" y="122" font-size="64" font-weight="600" fill="#1d1d1f" text-anchor="middle" letter-spacing="-1.8" class="up d1">8</text>
<text x="125.0" y="164" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="middle" class="up d1">National hackathon</text>
<text x="125.0" y="186" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="middle" class="up d1">wins.</text>
<text x="375.0" y="122" font-size="64" font-weight="600" fill="#1d1d1f" text-anchor="middle" letter-spacing="-1.8" class="up d2">250+</text>
<text x="375.0" y="164" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="middle" class="up d2">Teams at Spark Tank.</text>
<text x="375.0" y="186" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="middle" class="up d2">We placed second.</text>
<line x1="250.0" y1="72" x2="250.0" y2="186" stroke="#d2d2d7" stroke-width="1"/>
<text x="625.0" y="122" font-size="64" font-weight="600" fill="#1d1d1f" text-anchor="middle" letter-spacing="-1.8" class="up d3">1st</text>
<text x="625.0" y="164" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="middle" class="up d3">National challenge,</text>
<text x="625.0" y="186" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="middle" class="up d3">Intellect Design Arena.</text>
<line x1="500.0" y1="72" x2="500.0" y2="186" stroke="#d2d2d7" stroke-width="1"/>
<text x="875.0" y="122" font-size="64" font-weight="600" fill="#1d1d1f" text-anchor="middle" letter-spacing="-1.8" class="up d4">2</text>
<text x="875.0" y="164" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="middle" class="up d4">Product</text>
<text x="875.0" y="186" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="middle" class="up d4">internships.</text>
<line x1="750.0" y1="72" x2="750.0" y2="186" stroke="#d2d2d7" stroke-width="1"/>
</svg>