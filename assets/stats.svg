<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="236" viewBox="0 0 1000 236" role="img">
<defs>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;SF Pro Text&quot;, Inter, &quot;Segoe UI&quot;, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;}
.up{animation:up 1.1s cubic-bezier(.16,1,.3,1) both;}
.d1{animation-delay:.08s}.d2{animation-delay:.18s}.d3{animation-delay:.28s}
.d4{animation-delay:.38s}.d5{animation-delay:.48s}.d6{animation-delay:.58s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.drift1{animation:drift1 14s ease-in-out infinite alternate;}
.drift2{animation:drift2 17s ease-in-out infinite alternate;}
.drift3{animation:drift3 12s ease-in-out infinite alternate;}
@keyframes drift1{to{transform:translate(70px,-18px)}}
@keyframes drift2{to{transform:translate(-80px,10px)}}
@keyframes drift3{to{transform:translate(40px,14px)}}
.pulse{animation:pulse 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center;}
@keyframes pulse{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
</style>
<clipPath id="card"><rect x="0" y="0" width="1000" height="236" rx="30"/></clipPath>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="56"/></filter>
<filter id="blurS" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="34"/></filter>
<linearGradient id="ai" gradientUnits="userSpaceOnUse" x1="180" y1="0" x2="820" y2="0" spreadMethod="reflect"><stop offset="0.00" stop-color="#ff9f0a"/><stop offset="0.25" stop-color="#ff375f"/><stop offset="0.50" stop-color="#bf5af2"/><stop offset="0.75" stop-color="#5e5ce6"/><stop offset="1.00" stop-color="#0a84ff"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;640 0;0 0" dur="14s" repeatCount="indefinite"/></linearGradient>

</defs>
<rect x="0" y="0" width="1000" height="236" rx="30" fill="#000000"/>
<g clip-path="url(#card)">
<text x="125.0" y="116" font-size="64" font-weight="700" fill="url(#ai)" text-anchor="middle" letter-spacing="-2" class="up d1">8×</text>
<text x="125.0" y="156" font-size="15" font-weight="400" fill="#86868b" text-anchor="middle" class="up d1">National hackathon</text>
<text x="125.0" y="178" font-size="15" font-weight="400" fill="#86868b" text-anchor="middle" class="up d1">wins</text>
<text x="375.0" y="116" font-size="64" font-weight="700" fill="url(#ai)" text-anchor="middle" letter-spacing="-2" class="up d2">250+</text>
<text x="375.0" y="156" font-size="15" font-weight="400" fill="#86868b" text-anchor="middle" class="up d2">Teams in the field at</text>
<text x="375.0" y="178" font-size="15" font-weight="400" fill="#86868b" text-anchor="middle" class="up d2">Spark Tank, IIFM</text>
<line x1="250.0" y1="62" x2="250.0" y2="178" stroke="#fff" stroke-opacity=".1"/>
<text x="625.0" y="116" font-size="64" font-weight="700" fill="url(#ai)" text-anchor="middle" letter-spacing="-2" class="up d3">2</text>
<text x="625.0" y="156" font-size="15" font-weight="400" fill="#86868b" text-anchor="middle" class="up d3">Product</text>
<text x="625.0" y="178" font-size="15" font-weight="400" fill="#86868b" text-anchor="middle" class="up d3">internships</text>
<line x1="500.0" y1="62" x2="500.0" y2="178" stroke="#fff" stroke-opacity=".1"/>
<text x="875.0" y="116" font-size="64" font-weight="700" fill="url(#ai)" text-anchor="middle" letter-spacing="-2" class="up d4">#1</text>
<text x="875.0" y="156" font-size="15" font-weight="400" fill="#86868b" text-anchor="middle" class="up d4">Rank at Design Spark,</text>
<text x="875.0" y="178" font-size="15" font-weight="400" fill="#86868b" text-anchor="middle" class="up d4">Intellect Design Arena</text>
<line x1="750.0" y1="62" x2="750.0" y2="178" stroke="#fff" stroke-opacity=".1"/>
</g>
<rect x=".5" y=".5" width="999" height="235" rx="29.5" fill="none" stroke="#fff" stroke-opacity=".09"/>
</svg>