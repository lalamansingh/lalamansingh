<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img">
<defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;SF Pro Text&quot;, &quot;Helvetica Neue&quot;, Helvetica, Inter, &quot;Segoe UI&quot;, Arial, sans-serif;}
.up{animation:up 1.2s cubic-bezier(.25,.1,.25,1) both;}
.d1{animation-delay:.05s}.d2{animation-delay:.15s}.d3{animation-delay:.25s}
.d4{animation-delay:.35s}.d5{animation-delay:.45s}.d6{animation-delay:.55s}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style></defs>
<rect width="1000" height="360" rx="28" fill="#f5f5f7"/>

<text x="500" y="160" font-size="52" font-weight="600" fill="#1d1d1f" text-anchor="middle" letter-spacing="-1.4" class="up d1">Let’s make something great.</text>
<text x="500" y="206" font-size="19" font-weight="400" fill="#6e6e73" text-anchor="middle" letter-spacing="-0.1" class="up d2">Open to conversations about AI products, voice and building for India.</text>
<line x1="56" y1="276" x2="944" y2="276" stroke="#d2d2d7" stroke-width="1"/>
<text x="56" y="310" font-size="12" font-weight="400" fill="#86868b" text-anchor="start" class="up d3">Designed by Lal Aman Singh in Noida.</text>
<text x="944" y="310" font-size="12" font-weight="400" fill="#86868b" text-anchor="end" class="up d3">github.com/lalamansingh</text>

</svg>