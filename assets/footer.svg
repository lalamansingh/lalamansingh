<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="168" viewBox="0 0 1000 168" role="img">
<defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;SF Pro Text&quot;, &quot;Helvetica Neue&quot;, Helvetica, Inter, &quot;Segoe UI&quot;, Arial, sans-serif;}
.up{animation:up 1s cubic-bezier(.25,.1,.25,1) both;}
.d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.19s}
.d4{animation-delay:.26s}.d5{animation-delay:.33s}.d6{animation-delay:.4s}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style></defs>
<rect width="1000" height="168" rx="22" fill="#f5f5f7"/>

<text x="500.0" y="64.0" font-size="28" font-weight="600" fill="#1d1d1f" text-anchor="middle" letter-spacing="-0.6" class="up d1">Let’s make something great.</text>
<text x="500.0" y="90.0" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="middle" class="up d2">Open to conversations about AI products, voice and building for India.</text>
<line x1="40.0" y1="118.0" x2="960.0" y2="118.0" stroke="#d2d2d7" stroke-width="1"/>
<text x="40.0" y="142.0" font-size="11" font-weight="400" fill="#86868b" text-anchor="start">Designed by Lal Aman Singh in Noida.</text>
<text x="960.0" y="142.0" font-size="11" font-weight="400" fill="#86868b" text-anchor="end">github.com/lalamansingh</text>

</svg>