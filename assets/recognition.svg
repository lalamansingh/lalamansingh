<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="414" viewBox="0 0 1000 414" role="img">
<defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;SF Pro Text&quot;, &quot;Helvetica Neue&quot;, Helvetica, Inter, &quot;Segoe UI&quot;, Arial, sans-serif;}
.up{animation:up 1s cubic-bezier(.25,.1,.25,1) both;}
.d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.19s}
.d4{animation-delay:.26s}.d5{animation-delay:.33s}.d6{animation-delay:.4s}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.mark{transform:scaleX(0);transform-box:fill-box;transform-origin:left center;
  animation:mark .7s cubic-bezier(.3,.6,.3,1) forwards;}
@keyframes mark{to{transform:scaleX(1)}}
</style></defs>
<rect width="1000" height="414" rx="22" fill="#f5f5f7"/>
<text x="40.0" y="62.0" font-size="30" font-weight="600" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.7" class="up d1">Recognition.</text><text x="40.0" y="88.0" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start" class="up d2">Eight national wins. Each one built in hours, not months.</text>
<defs>
<filter id="lift" x="-10%" y="-20%" width="120%" height="150%">
  <feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#000" flood-opacity=".07"/>
</filter>
<linearGradient id="sheenInk" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
  <stop offset="0" stop-color="#1d1d1f"/><stop offset=".42" stop-color="#1d1d1f"/>
  <stop offset=".5" stop-color="#8e8e93"/><stop offset=".58" stop-color="#1d1d1f"/><stop offset="1" stop-color="#1d1d1f"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="5s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="sheenNew" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
  <stop offset="0" stop-color="#b64400"/><stop offset=".42" stop-color="#b64400"/>
  <stop offset=".5" stop-color="#e3893f"/><stop offset=".58" stop-color="#b64400"/><stop offset="1" stop-color="#b64400"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="5s" repeatCount="indefinite"/>
</linearGradient>
</defs>
<g class="up d3">
<rect x="40.0" y="110" width="297.3" height="108" rx="14" fill="#ffffff" filter="url(#lift)"/>
<text x="62.0" y="154.0" font-size="30" font-weight="600" fill="url(#sheenNew)" text-anchor="start" letter-spacing="-0.8">1st</text>
<text x="317.3" y="138.0" font-size="11" font-weight="500" fill="#b64400" text-anchor="end">Cash award + internship</text>
<text x="62.0" y="184.0" font-size="16" font-weight="600" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.25">Design Spark Challenge</text>
<text x="62.0" y="203.0" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="start">Intellect Design Arena, Chennai.</text>
</g>
<g class="up d4">
<rect x="351.3" y="110" width="297.3" height="108" rx="14" fill="#ffffff" filter="url(#lift)"/>
<text x="373.3" y="154.0" font-size="30" font-weight="600" fill="url(#sheenNew)" text-anchor="start" letter-spacing="-0.8">1st</text>
<text x="628.7" y="138.0" font-size="11" font-weight="500" fill="#b64400" text-anchor="end">Oct 2025</text>
<text x="373.3" y="184.0" font-size="16" font-weight="600" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.25">National Level Tech Hackathon</text>
<text x="373.3" y="203.0" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="start">Dr. Virendra Swarup Institute, Kanpur.</text>
</g>
<g class="up d5">
<rect x="662.7" y="110" width="297.3" height="108" rx="14" fill="#ffffff" filter="url(#lift)"/>
<text x="684.7" y="154.0" font-size="30" font-weight="600" fill="url(#sheenNew)" text-anchor="start" letter-spacing="-0.8">1st</text>
<text x="940.0" y="138.0" font-size="11" font-weight="500" fill="#b64400" text-anchor="end">Jul 2025</text>
<text x="684.7" y="184.0" font-size="16" font-weight="600" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.25">AI Product Builder</text>
<text x="684.7" y="203.0" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="start">Jivika Future Work Pvt. Ltd.</text>
</g>
<g class="up d4">
<rect x="40.0" y="232" width="297.3" height="108" rx="14" fill="#ffffff" filter="url(#lift)"/>
<text x="62.0" y="276.0" font-size="30" font-weight="600" fill="url(#sheenInk)" text-anchor="start" letter-spacing="-0.8">2nd</text>
<text x="317.3" y="260.0" font-size="11" font-weight="500" fill="#86868b" text-anchor="end">Oct 2025</text>
<text x="62.0" y="306.0" font-size="16" font-weight="600" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.25">Spark Tank</text>
<text x="62.0" y="325.0" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="start">IIFM Bhopal. Runner-up of 250+ teams.</text>
</g>
<g class="up d5">
<rect x="351.3" y="232" width="297.3" height="108" rx="14" fill="#ffffff" filter="url(#lift)"/>
<text x="373.3" y="276.0" font-size="30" font-weight="600" fill="url(#sheenInk)" text-anchor="start" letter-spacing="-0.8">3rd</text>
<text x="628.7" y="260.0" font-size="11" font-weight="500" fill="#86868b" text-anchor="end">Nov 2025</text>
<text x="373.3" y="306.0" font-size="16" font-weight="600" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.25">Chakravyuh B-Plan</text>
<text x="373.3" y="325.0" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="start">CVS, Delhi University. 2nd Runner-Up.</text>
</g>
<g class="up d6">
<rect x="662.7" y="232" width="297.3" height="108" rx="14" fill="#ffffff" filter="url(#lift)"/>
<text x="684.7" y="276.0" font-size="30" font-weight="600" fill="url(#sheenInk)" text-anchor="start" letter-spacing="-0.8">24h</text>
<text x="940.0" y="260.0" font-size="11" font-weight="500" fill="#86868b" text-anchor="end">24-hour build</text>
<text x="684.7" y="306.0" font-size="16" font-weight="600" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.25">AI HackMatrix</text>
<text x="684.7" y="325.0" font-size="12.5" font-weight="400" fill="#6e6e73" text-anchor="start">Chandigarh University. Built Hardini.</text>
</g>
<text x="40.0" y="380.0" font-size="13.5" font-weight="400" fill="#6e6e73" text-anchor="start" class="up d6">Also pitched at</text>
<rect class="mark" style="animation-delay:0.70s" x="153" y="367.5" width="74.6" height="17" rx="3" fill="#ffcc00" fill-opacity=".42"/>
<text x="156" y="380" font-size="13.5" class="up d6"><tspan font-weight="600" fill="#1d1d1f">IIT Bombay</tspan><tspan font-weight="400" fill="#6e6e73">, National Entrepreneurship Challenge</tspan></text>
<rect class="mark" style="animation-delay:1.15s" x="477" y="367.5" width="89.9" height="17" rx="3" fill="#ffcc00" fill-opacity=".42"/>
<text x="480" y="380" font-size="13.5" class="up d6"><tspan font-weight="600" fill="#1d1d1f">IIM Bangalore</tspan><tspan font-weight="400" fill="#6e6e73">, Pitch Perfect, Season 8</tspan></text>
<rect class="mark" style="animation-delay:1.60s" x="741" y="367.5" width="34.2" height="17" rx="3" fill="#ffcc00" fill-opacity=".42"/>
<text x="744" y="380" font-size="13.5" class="up d6"><tspan font-weight="600" fill="#1d1d1f">BHU</tspan><tspan font-weight="400" fill="#6e6e73">, Bharat Innovation Conclave</tspan></text>
</svg>