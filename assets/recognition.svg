<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="502" viewBox="0 0 1000 502" role="img">
<defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;SF Pro Text&quot;, &quot;Helvetica Neue&quot;, Helvetica, Inter, &quot;Segoe UI&quot;, Arial, sans-serif;}
.up{animation:up 1s cubic-bezier(.25,.1,.25,1) both;}
.d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.19s}
.d4{animation-delay:.26s}.d5{animation-delay:.33s}.d6{animation-delay:.4s}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.breathe{animation:breathe 6s ease-in-out infinite alternate;}
@keyframes breathe{0%{opacity:.55}100%{opacity:1}}
.twinkle{opacity:0;animation:twinkle 5.5s ease-in-out infinite;transform-box:fill-box;}
@keyframes twinkle{0%,100%{opacity:0}45%{opacity:0}55%{opacity:.55}65%{opacity:0}}
</style></defs>
<rect width="1000" height="502" rx="22" fill="#f5f5f7"/>
<text x="40.0" y="62.0" font-size="30" font-weight="600" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.7" class="up d1">Recognition.</text><text x="40.0" y="88.0" font-size="15" font-weight="400" fill="#6e6e73" text-anchor="start" class="up d2">Eight national wins. Each one built in hours, not months.</text>
<defs>
<filter id="lift" x="-10%" y="-20%" width="120%" height="150%">
  <feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#000" flood-opacity=".07"/>
</filter>
<linearGradient id="sheenInk" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
  <stop offset="0" stop-color="#1d1d1f"/><stop offset=".42" stop-color="#1d1d1f"/>
  <stop offset=".5" stop-color="#8e8e93"/><stop offset=".58" stop-color="#1d1d1f"/><stop offset="1" stop-color="#1d1d1f"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="5s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="sheenNew" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
  <stop offset="0" stop-color="#b64400"/><stop offset=".42" stop-color="#b64400"/>
  <stop offset=".5" stop-color="#e3893f"/><stop offset=".58" stop-color="#b64400"/><stop offset="1" stop-color="#b64400"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="5s" repeatCount="indefinite"/>
</linearGradient>
<radialGradient id="warm"><stop offset="0" stop-color="#b64400" stop-opacity=".16"/>
  <stop offset="1" stop-color="#b64400" stop-opacity="0"/></radialGradient>
