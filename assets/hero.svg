<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img">
<defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;SF Pro Text&quot;, &quot;Helvetica Neue&quot;, Helvetica, Inter, &quot;Segoe UI&quot;, Arial, sans-serif;}
.up{animation:up 1.2s cubic-bezier(.25,.1,.25,1) both;}
.d1{animation-delay:.05s}.d2{animation-delay:.15s}.d3{animation-delay:.25s}
.d4{animation-delay:.35s}.d5{animation-delay:.45s}.d6{animation-delay:.55s}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style></defs>
<rect width="1000" height="480" rx="28" fill="#f5f5f7"/>

<text x="500" y="222" font-size="92" font-weight="600" fill="#1d1d1f" text-anchor="middle" letter-spacing="-2.6" class="up d1">Lal Aman Singh</text>
<text x="500" y="282" font-size="28" font-weight="400" fill="#1d1d1f" text-anchor="middle" letter-spacing="-0.4" class="up d2">AI Product Intern at IndusLabs.</text>
<text x="500" y="326" font-size="19" font-weight="400" fill="#6e6e73" text-anchor="middle" letter-spacing="-0.1" class="up d3">Noida, India</text>

</svg>