<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img">
<defs>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, &quot;SF Pro Display&quot;, &quot;SF Pro Text&quot;, Inter, &quot;Segoe UI&quot;, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif;}
.up{animation:up 1.1s cubic-bezier(.16,1,.3,1) both;}
.d1{animation-delay:.08s}.d2{animation-delay:.18s}.d3{animation-delay:.28s}
.d4{animation-delay:.38s}.d5{animation-delay:.48s}.d6{animation-delay:.58s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.drift1{animation:drift1 14s ease-in-out infinite alternate;}
.drift2{animation:drift2 17s ease-in-out infinite alternate;}
.drift3{animation:drift3 12s ease-in-out infinite alternate;}
@keyframes drift1{to{transform:translate(70px,-18px)}}
@keyframes drift2{to{transform:translate(-80px,10px)}}
@keyframes drift3{to{transform:translate(40px,14px)}}
.pulse{animation:pulse 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center;}
@keyframes pulse{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
</style>
<clipPath id="card"><rect x="0" y="0" width="1000" height="600" rx="30"/></clipPath>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="56"/></filter>
<filter id="blurS" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="34"/></filter>
<linearGradient id="ai" gradientUnits="userSpaceOnUse" x1="180" y1="0" x2="820" y2="0" spreadMethod="reflect"><stop offset="0.00" stop-color="#ff9f0a"/><stop offset="0.25" stop-color="#ff375f"/><stop offset="0.50" stop-color="#bf5af2"/><stop offset="0.75" stop-color="#5e5ce6"/><stop offset="1.00" stop-color="#0a84ff"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;640 0;0 0" dur="14s" repeatCount="indefinite"/></linearGradient>

</defs>
<rect x="0" y="0" width="1000" height="600" rx="30" fill="#000000"/>
<g clip-path="url(#card)">

<ellipse class="drift1" cx="300" cy="650" rx="270" ry="110" fill="#bf5af2" opacity="0.62" filter="url(#blur)"/>
<ellipse class="drift2" cx="520" cy="650" rx="280" ry="110" fill="#ff375f" opacity="0.50" filter="url(#blur)"/>
<ellipse class="drift3" cx="730" cy="650" rx="250" ry="110" fill="#0a84ff" opacity="0.58" filter="url(#blur)"/>
<ellipse class="drift1" cx="470" cy="650" rx="170" ry="110" fill="#ff9f0a" opacity="0.38" filter="url(#blur)"/>
<text x="500" y="156" font-size="14" font-weight="700" fill="url(#ai)" text-anchor="middle" letter-spacing="3.2" class="up d1">AI PRODUCT MANAGER</text>
<text x="500" y="258" font-size="90" font-weight="700" fill="#f5f5f7" text-anchor="middle" letter-spacing="-3" class="up d2">Lal Aman Singh.</text>
<text x="500" y="322" font-size="34" font-weight="600" fill="url(#ai)" text-anchor="middle" letter-spacing="-0.6" class="up d3">Conversations in. Value out.</text>
<text x="500" y="374" font-size="21" font-weight="400" fill="#a1a1a6" text-anchor="middle" class="up d4">I design and ship voice AI that speaks India’s languages.</text>
<g class="up d5">
<rect x="209.0" y="418" width="300" height="46" rx="23.0" fill="#f5f5f7"/><text x="359.0" y="446.76" font-size="16" font-weight="600" fill="#1d1d1f" text-anchor="middle">AI Product Intern at IndusLabs</text>
<rect x="523.5" y="418.5" width="267" height="45" rx="22.5" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".22"/><text x="657.0" y="446.76" font-size="16" font-weight="600" fill="#f5f5f7" text-anchor="middle">8× National Hackathon Winner</text>
</g>
<text x="500" y="548" font-size="14" font-weight="500" fill="#f5f5f7" text-anchor="middle" letter-spacing="0.4" class="up d6" fill-opacity=".72">Noida, India   ·   He/Him</text>

</g>
<rect x=".5" y=".5" width="999" height="599" rx="29.5" fill="none" stroke="#fff" stroke-opacity=".09"/>
</svg>